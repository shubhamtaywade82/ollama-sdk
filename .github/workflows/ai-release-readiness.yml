name: AI Release Readiness

# Advisory pre-release assessment. This workflow never publishes or creates a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-release-readiness-main
  cancel-in-progress: false

jobs:
  readiness:
    # Keep the release assessment tied to the default branch, not an arbitrary ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run deterministic release verification
        run: npm run verify:release

      - name: Guard - Ollama Cloud Key
        id: guard
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [[ -n "${OLLAMA_API_KEY:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OLLAMA_API_KEY secret unavailable; skipping AI release readiness."
          fi

      - name: Run advisory Release Readiness Agent
        if: steps.guard.outputs.available == 'true'
        run: npx tsx tools/ci-agent/src/release-readiness.ts
        env:
          OLLAMA_HOST: https://ollama.com
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL_RELEASE || 'glm-5.3-flash:cloud' }}
