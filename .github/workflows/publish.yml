name: Publish

# Called by release-please.yml only. That file must be the trusted-publisher
# entry on npmjs.com, because trusted publishing validates the calling workflow.
# Publishes with npm trusted publishing (OIDC): no npm token is stored or used.
# The direct `release` and `workflow_dispatch` triggers were removed; each would
# make this file the caller. Manual runs go through release-please.yml's
# workflow_dispatch.

on:
  workflow_call:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: false
        type: string
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # OIDC token for npm trusted publishing (also drives provenance).
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # No registry-url: npm defaults to registry.npmjs.org, and setup-node's
      # .npmrc auth placeholder must not shadow the OIDC credential.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Trusted publishing needs npm >= 11.21.0 for dist-tag handling.
      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0

      - name: Validate dist-tag
        # Security: `inputs.tag` must reach the shell ONLY through the environment.
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          if [[ ! "$NPM_DIST_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "::error::Invalid npm dist-tag '$NPM_DIST_TAG'. Refusing to publish."
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Verify Quality and Build
        # Full release gate, run once. The publish step uses --ignore-scripts,
        # so prepublishOnly does not run a second time.
        run: npm run verify:release

      - name: Publish to npm (trusted publishing)
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG" --ignore-scripts
