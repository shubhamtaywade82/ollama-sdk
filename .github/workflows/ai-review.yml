name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Avoid running on draft PRs or external forks without access to secrets
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build SDK artifacts
        run: npm ci --ignore-scripts && npm run build

      - name: Guard - Ollama Cloud Key
        id: guard
        run: |
          if [ -n "${{ secrets.OLLAMA_API_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OLLAMA_API_KEY secret unavailable; skipping review."
          fi

      - name: Run Review Agent
        if: steps.guard.outputs.available == 'true'
        run: npx tsx tools/ci-agent/src/review.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OLLAMA_HOST: https://ollama.com
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL_REVIEW || 'glm-5.3-flash:cloud' }}
