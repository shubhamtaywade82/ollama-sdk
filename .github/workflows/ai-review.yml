name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Never run on fork/draft PRs or recursively review an agent-created fix PR.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'ci-agent/fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build SDK artifacts
        run: npm ci --ignore-scripts && npm run build

      - name: Guard - Ollama Cloud Key and model
        id: guard
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL_REVIEW: ${{ vars.OLLAMA_MODEL_REVIEW }}
        run: |
          if [[ -n "${OLLAMA_API_KEY:-}" && -n "${OLLAMA_MODEL_REVIEW:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OLLAMA_API_KEY or OLLAMA_MODEL_REVIEW unavailable; skipping paid review."
          fi

      - name: Run Review Agent
        if: steps.guard.outputs.available == 'true'
        run: npx tsx tools/ci-agent/src/review.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OLLAMA_HOST: https://ollama.com
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL_REVIEW }}
          OLLAMA_MODEL_ESCALATION: ${{ vars.OLLAMA_MODEL_REVIEW_ESCALATION }}
