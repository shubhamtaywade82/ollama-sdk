name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      - name: Verify Ollama contract parity (structural)
        # --skip-live-docs avoids hitting docs.ollama.com from CI; the
        # structural half (TypeScript interface + IR parity blocks) is
        # sufficient for the PR gate. Live-docs verification runs in
        # the dedicated contract-parity job below.
        run: npm run verify:contract-parity -- --skip-live-docs

      - run: npm test

      - run: npm run build

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Check published type resolution
        run: npx --yes @arethetypeswrong/cli@latest --pack .

      - name: Verify consumer tarball installation and module resolution
        run: |
          TARBALL=$(npm pack --pack-destination /tmp | tail -n 1)
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          echo '{"name":"consumer","version":"1.0.0"}' > package.json
          npm install "/tmp/${TARBALL}"
          node -e "const { OllamaClient } = require('@nemesis-oss/ollama-sdk'); if (typeof OllamaClient !== 'function') throw new Error('CJS entry broken');"
          node --input-type=module -e "import { OllamaClient } from '@nemesis-oss/ollama-sdk'; if (typeof OllamaClient !== 'function') throw new Error('ESM entry broken');"
          node --input-type=module -e "import { connectStdioMcpClient } from '@nemesis-oss/ollama-sdk/mcp/stdio'; if (typeof connectStdioMcpClient !== 'function') throw new Error('MCP stdio entry broken');"
          node --input-type=module -e "import { connectMcpHttpClient, connectStreamableHttpMcpClient } from '@nemesis-oss/ollama-sdk/mcp/http'; if (typeof connectMcpHttpClient !== 'function' || typeof connectStreamableHttpMcpClient !== 'function') throw new Error('MCP HTTP entry broken');"

  contract-parity:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - name: Verify contract parity (structural + live-docs)
        # This job runs the FULL verifier including live-docs fetching
        # from docs.ollama.com. The pinned fallback snapshots under
        # docs/upstream/ are used when the live docs are unreachable.
        run: npm run verify:contract-parity

  edge-runtime:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Verify dist/index.js bundles and runs with zero Node.js APIs
        run: npm run verify:edge-runtime

  benchmarks:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run benchmarks
        run: npm run bench
