name: CI

on:
  # PR branches are covered by `pull_request` (which tests the merge result);
  # `push` only runs for main so each PR commit triggers one CI run, not two.
  push:
    branches: [main]
  pull_request:

# A newer commit on the same PR cancels its in-flight run. Pushes to main are
# grouped per commit SHA, so no main run is ever cancelled or superseded while
# pending (a shared group would drop queued runs) and every merge gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Node 22 (maintenance LTS) + Node 24 (active LTS) are the verified
      # matrix. `engines` is `>=22`, matching the matrix floor. Node 20 reached
      # end-of-life 2026-04-30 and is no longer supported.
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify contract (schema, compatibility, endpoint discovery)
        run: npm run contract:validate

      - name: Verify IR is not stale (overlay edited but IR not re-committed)
        run: npm run contract:diff

      - name: Verify generated code is not stale (IR re-committed but generated files not re-committed)
        run: |
          npm run contract:generate
          git diff --exit-code --stat src/generated/

      - name: Verify no unexpected type drift
        run: npm run contract:drift -- --strict

      - run: npm run typecheck

      - run: npm run typecheck:examples

      - run: npm run lint

      - run: npm run format:check

      - name: Verify Ollama contract parity (structural)
        # --skip-live-docs avoids hitting docs.ollama.com from CI; the
        # structural half (TypeScript interface + IR parity blocks) is
        # sufficient for the PR gate. Live-docs verification runs in
        # the dedicated contract-parity job below.
        run: npm run verify:contract-parity -- --skip-live-docs

      - run: npm test

      - run: npm run build

  coverage:
    # Enforces the vitest.config.ts coverage thresholds (statements/branches/
    # functions/lines) — the `test` job runs the same suite but without
    # coverage instrumentation, so regressions would otherwise be invisible
    # to CI. Runs on the LTS floor (Node 22) only; one instrumented pass is
    # enough and keeps the matrix legs fast.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Enforce coverage thresholds
        run: npm run test:coverage

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Check published type resolution
        run: npx --yes @arethetypeswrong/cli@latest --pack .

      - name: Verify NodeNext TypeScript consumer compilation (CJS + ESM)
        # Compiles two real consumer projects against the packed tarball:
        # a CommonJS consumer (module node16 -> .d.cts via the `require`
        # condition) and an ESM consumer (module nodenext -> .d.ts via the
        # `import` condition). Catches the TS1479 "masquerading ESM types"
        # class and ambient-global leaks (e.g. `Buffer`) that attw alone
        # cannot see. See scripts/verify-consumer-types.sh.
        run: npm run verify:consumer-types

      - name: Verify consumer tarball installation and module resolution
        run: |
          TARBALL=$(npm pack --pack-destination /tmp | tail -n 1)
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          echo '{"name":"consumer","version":"1.0.0"}' > package.json
          npm install "/tmp/${TARBALL}"
          node -e "const { OllamaClient } = require('@nemesis-oss/ollama-sdk'); if (typeof OllamaClient !== 'function') throw new Error('CJS entry broken');"
          node --input-type=module -e "import { OllamaClient } from '@nemesis-oss/ollama-sdk'; if (typeof OllamaClient !== 'function') throw new Error('ESM entry broken');"
          node --input-type=module -e "import { connectStdioMcpClient } from '@nemesis-oss/ollama-sdk/mcp/stdio'; if (typeof connectStdioMcpClient !== 'function') throw new Error('MCP stdio entry broken');"
          node --input-type=module -e "import { connectMcpHttpClient, connectStreamableHttpMcpClient } from '@nemesis-oss/ollama-sdk/mcp/http'; if (typeof connectMcpHttpClient !== 'function' || typeof connectStreamableHttpMcpClient !== 'function') throw new Error('MCP HTTP entry broken');"
          node --input-type=module -e "import { OllamaRuntime } from '@nemesis-oss/ollama-sdk/generated/runtime'; if (typeof OllamaRuntime !== 'function') throw new Error('generated/runtime entry broken');"
          node --input-type=module -e "import { NativeApi } from '@nemesis-oss/ollama-sdk/generated/api'; if (typeof NativeApi !== 'function') throw new Error('generated/api entry broken');"
          node --input-type=module -e "import { ChatRequestSchema } from '@nemesis-oss/ollama-sdk/generated/models/schemas'; if (typeof ChatRequestSchema !== 'object') throw new Error('generated/models/schemas entry broken');"
          node --input-type=module -e "import { listGeneratedOllamaTools } from '@nemesis-oss/ollama-sdk/mcp/generated'; if (typeof listGeneratedOllamaTools !== 'function') throw new Error('mcp/generated entry broken');"

  contract-parity:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - name: Verify contract parity (structural + live-docs)
        # This job runs the FULL verifier including live-docs fetching
        # from docs.ollama.com. The pinned fallback snapshots under
        # docs/upstream/ are used when the live docs are unreachable.
        run: npm run verify:contract-parity

  edge-runtime:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Verify dist/index.js bundles and runs with zero Node.js APIs
        run: npm run verify:edge-runtime

  conformance:
    # Runs the conformance suite against a REAL Ollama server (installed
    # via the official install script + a tiny model pulled at setup).
    # This is the last line of defense against wire-vs-contract drift:
    # if Ollama's actual response shape diverges from the IR-derived Zod
    # schema, these tests fail. See ADR 0021.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install pinned Ollama (System One requires >= 0.35.0)
        run: |
          # Pinned, so the wire-contract check runs against a known server.
          # The value must equal CONFORMANCE_OLLAMA_VERSION in
          # scripts/upstream-drift.ts; test/conformance-pin.test.ts enforces that.
          # The official script serves the pinned release via OLLAMA_VERSION.
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.16 sh
          VERSION=$(ollama --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Installed Ollama version: $VERSION"
          if [ "$VERSION" != "0.40.16" ]; then
            echo "Expected Ollama 0.40.16, got $VERSION" >&2
            exit 1
          fi

      - name: Start Ollama server
        run: |
          ollama serve &
          # Wait for the server to be reachable (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
              echo "Ollama is up"
              break
            fi
            sleep 1
          done
          # Print the server version for CI log clarity
          curl -s http://localhost:11434/api/version || true

      - name: Pull conformance models
        run: |
          ollama pull qwen3:0.6b
          ollama pull nomic-embed-text:latest
          # Wave 17: System One conformance is mandatory, not skippable.
          # tev1:0.8b is the smallest System One-compatible model. If this
          # pull fails, the conformance job fails — System One live tests
          # must execute, not skip.
          ollama pull tev1:0.8b

      - name: Run conformance tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
        run: npm run test:conformance

  benchmarks:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run benchmarks
        run: npm run bench
