# OpenAI compatibility overlay.
#
# Each operation here corresponds to a `## /v1/...` heading in
# docs/upstream/ollama-openai-compatibility.mdx. The overlay captures the
# compatibility surface that OpenAPI cannot express: which OpenAI request
# fields are supported, which are explicitly unsupported, which the SDK
# forwards for interop even though Ollama doesn't document them.
#
# Field status mirrors the checkbox lists at
# https://docs.ollama.com/api/openai-compatibility.md: `[x]` entries are
# `fields`, `[ ]` entries are `unsupportedFields` (still typed on the broad
# OpenAI* request interfaces for drop-in interop, excluded from the strict
# OllamaOpenAI* request types).
#
# openaiAudioSpeech (added 2026-10-23, upstream docs commit 6ef847b8 —
# documented ahead of upstream's own openapi.yaml) is declared for
# endpoint-discovery completeness and field-matrix parity, but is excluded
# from the generated API class and MCP tools: its response is a raw audio
# byte stream the generated runtime cannot transport (the createBlob
# precedent — see ADR 0037).

version: 1
service: ollama
domain: openai

operations:
  openaiChatCompletions:
    path: /v1/chat/completions
    method: POST
    runtime:
      streaming: supported
      streamingDefault: false
      transport: sse
    environment:
      local: supported
      cloud: supported
    capabilities:
      tools: model-dependent
      thinking: model-dependent
      structuredOutput: supported
      logprobs: unsupported
      vision: model-dependent
    notes:
      - 'Ollama exposes a subset of the OpenAI Chat Completions request fields; see docs/upstream/ollama-openai-compatibility.mdx.'

    parity:
      legacySurfaceId: 'openai-chat'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAIChatCompletionRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'messages'
          - 'frequency_penalty'
          - 'presence_penalty'
          - 'response_format'
          - 'seed'
          - 'stop'
          - 'stream'
          - 'stream_options'
          - 'temperature'
          - 'top_p'
          - 'max_tokens'
          - 'tools'
          - 'reasoning_effort'
          - 'reasoning'
        unsupportedFields:
          - 'tool_choice'
          - 'logit_bias'
          - 'user'
          - 'n'
          - 'logprobs'
        sdkOnlyFields:
          - 'parallel_tool_calls'
          - 'top_logprobs'
        featureAliases:
          'logprobs': ['Logprobs']
  openaiCompletions:
    path: /v1/completions
    method: POST
    runtime:
      streaming: supported
      streamingDefault: false
      transport: sse
    environment:
      local: supported
      cloud: supported
    capabilities:
      logprobs: unsupported

    parity:
      legacySurfaceId: 'openai-completions'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAICompletionRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'prompt'
          - 'frequency_penalty'
          - 'presence_penalty'
          - 'seed'
          - 'stop'
          - 'stream'
          - 'stream_options'
          - 'temperature'
          - 'top_p'
          - 'max_tokens'
          - 'suffix'
        unsupportedFields:
          - 'best_of'
          - 'echo'
          - 'logit_bias'
          - 'user'
          - 'n'
          - 'logprobs'
        featureAliases:
          'logprobs': ['Logprobs']
  openaiEmbeddings:
    path: /v1/embeddings
    method: POST
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      cloud: supported
    capabilities:
      embeddings: supported

    parity:
      legacySurfaceId: 'openai-embeddings'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAIEmbeddingRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'input'
          - 'encoding_format'
          - 'dimensions'
        unsupportedFields:
          - 'user'
        docAliases:
          'encoding_format': ['encoding_format', 'encoding format']
  openaiResponses:
    path: /v1/responses
    method: POST
    runtime:
      streaming: supported
      streamingDefault: false
      transport: sse
    environment:
      local: supported
      cloud: supported
    capabilities:
      tools: model-dependent
      thinking: model-dependent
    notes:
      - 'Ollama implements a subset of the OpenAI Responses API; previous_response_id and conversation are explicitly unsupported.'

    parity:
      legacySurfaceId: 'openai-responses'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAIResponsesRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'input'
          - 'instructions'
          - 'tools'
          - 'stream'
          - 'temperature'
          - 'top_p'
          - 'max_output_tokens'
          - 'reasoning'
          - 'think'
        unsupportedFields:
          - 'previous_response_id'
          - 'conversation'
          - 'truncation'
        sdkOnlyFields:
          - 'parallel_tool_calls'
      stream:
        unionName: 'OpenAIResponsesStreamEvent'
        interfaceNames:
          - 'OpenAIResponsesOutputTextDeltaEvent'
          - 'OpenAIResponsesOutputTextDoneEvent'
          - 'OpenAIResponsesFunctionCallArgumentsDeltaEvent'
          - 'OpenAIResponsesFunctionCallArgumentsDoneEvent'
          - 'OpenAIResponsesReasoningTextDeltaEvent'
          - 'OpenAIResponsesReasoningTextDoneEvent'
          - 'OpenAIResponsesReasoningSummaryPartAddedEvent'
          - 'OpenAIResponsesReasoningSummaryPartDoneEvent'
          - 'OpenAIResponsesReasoningSummaryTextDeltaEvent'
          - 'OpenAIResponsesReasoningSummaryTextDoneEvent'
          - 'OpenAIResponsesOutputItemAddedEvent'
          - 'OpenAIResponsesOutputItemDoneEvent'
          - 'OpenAIResponsesContentPartAddedEvent'
          - 'OpenAIResponsesContentPartDoneEvent'
          - 'OpenAIResponsesRefusalDeltaEvent'
          - 'OpenAIResponsesRefusalDoneEvent'
          - 'OpenAIResponsesCreatedEvent'
          - 'OpenAIResponsesInProgressEvent'
          - 'OpenAIResponsesQueuedEvent'
          - 'OpenAIResponsesCompletedEvent'
          - 'OpenAIResponsesFailedEvent'
          - 'OpenAIResponsesIncompleteEvent'
  openaiAudioSpeech:
    path: /v1/audio/speech
    method: POST
    runtime:
      # Truth: the response streams while audio is generated. transport stays
      # 'json' (the request body IS JSON) and is inert for this operation —
      # it is excluded from the generated API class and MCP tools because the
      # runtime has no binary-audio response transport (createBlob precedent:
      # declared in the IR for endpoint-discovery completeness only).
      streaming: supported
      transport: json
    environment:
      local: supported
      cloud: supported
    compatibility:
      minVersion: '0.40.8'
    status:
      documented: true
      experimental: true
    notes:
      - 'Generates audio with speech models; the response is a raw audio byte stream (16-bit mono, 24 kHz), not JSON/NDJSON/SSE — the generated runtime cannot transport it.'
      - 'Recorded for endpoint-discovery completeness and docs parity tracking; excluded from the generated OpenAIApi class and from MCP tools (binary-transport exclusion).'
      - 'The typed request shape is exported as OpenAISpeechRequest (src/integrations/openai.ts) for direct use until an audio transport lands.'
    parity:
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAISpeechRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'input'
          - 'voice'
          - 'response_format'
          - 'speed'
          - 'stream_format'
        unsupportedFields:
          - 'instructions'
        nestedUnsupportedFields:
          - 'response_format.mp3'
          - 'response_format.opus'
          - 'response_format.aac'
          - 'response_format.flac'
  openaiModels:
    path: /v1/models
    method: GET
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      cloud: supported

  openaiModelsGetOne:
    path: /v1/models/{model}
    method: GET
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      cloud: supported
    notes:
      - 'Returns metadata for a single OpenAI-compat model by id.'

parityBridge:
  openai-chat: openaiChatCompletions
  openai-completions: openaiCompletions
  openai-embeddings: openaiEmbeddings
  openai-responses: openaiResponses
