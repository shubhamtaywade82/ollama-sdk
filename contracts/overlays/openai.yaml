# OpenAI compatibility overlay.
#
# Each operation here corresponds to a `## /v1/...` heading in
# docs/upstream/ollama-openai-compatibility.mdx. The overlay captures the
# compatibility surface that OpenAPI cannot express: which OpenAI request
# fields are supported, which are explicitly unsupported, which the SDK
# forwards for interop even though Ollama doesn't document them.
#
# In Wave 1 this overlay is structural metadata only — field-level parity
# still lives in docs/api-parity.json and is verified by the legacy
# scripts/verify-api-parity.ts. Wave 5 migrates the field-level contract
# into this overlay.

version: 1
service: ollama
domain: openai

operations:
  openaiChatCompletions:
    path: /v1/chat/completions
    method: POST
    runtime:
      streaming: supported
      streamingDefault: false
      transport: sse
    environment:
      local: supported
      cloud: supported
    capabilities:
      tools: model-dependent
      thinking: model-dependent
      structuredOutput: supported
      logprobs: supported
      vision: model-dependent
    notes:
      - 'Ollama exposes a subset of the OpenAI Chat Completions request fields; see docs/upstream/ollama-openai-compatibility.mdx.'

    parity:
      legacySurfaceId: 'openai-chat'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAIChatCompletionRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'messages'
          - 'frequency_penalty'
          - 'presence_penalty'
          - 'response_format'
          - 'seed'
          - 'stop'
          - 'stream'
          - 'stream_options'
          - 'temperature'
          - 'top_p'
          - 'max_tokens'
          - 'tools'
          - 'reasoning_effort'
          - 'reasoning'
          - 'tool_choice'
          - 'logit_bias'
          - 'user'
          - 'n'
          - 'logprobs'
        sdkOnlyFields:
          - 'parallel_tool_calls'
        featureAliases:
          'logprobs': ['Logprobs']
  openaiCompletions:
    path: /v1/completions
    method: POST
    runtime:
      streaming: supported
      streamingDefault: false
      transport: sse
    environment:
      local: supported
      cloud: supported
    capabilities:
      logprobs: supported

    parity:
      legacySurfaceId: 'openai-completions'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAICompletionRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'prompt'
          - 'frequency_penalty'
          - 'presence_penalty'
          - 'seed'
          - 'stop'
          - 'stream'
          - 'stream_options'
          - 'temperature'
          - 'top_p'
          - 'max_tokens'
          - 'suffix'
          - 'best_of'
          - 'echo'
          - 'logit_bias'
          - 'user'
          - 'n'
          - 'logprobs'
        featureAliases:
          'logprobs': ['Logprobs']
  openaiEmbeddings:
    path: /v1/embeddings
    method: POST
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      cloud: supported
    capabilities:
      embeddings: supported

    parity:
      legacySurfaceId: 'openai-embeddings'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAIEmbeddingRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'input'
          - 'encoding_format'
          - 'dimensions'
          - 'user'
        docAliases:
          'encoding_format': ['encoding_format', 'encoding format']
  openaiResponses:
    path: /v1/responses
    method: POST
    runtime:
      streaming: supported
      streamingDefault: false
      transport: sse
    environment:
      local: supported
      cloud: supported
    capabilities:
      tools: model-dependent
      thinking: model-dependent
    notes:
      - 'Ollama implements a subset of the OpenAI Responses API; previous_response_id and conversation are explicitly unsupported.'

    parity:
      legacySurfaceId: 'openai-responses'
      docsUrl: 'https://docs.ollama.com/api/openai-compatibility'
      fallbackDocsFile: 'docs/upstream/ollama-openai-compatibility.mdx'
      request:
        interfaceName: 'OpenAIResponsesRequest'
        sourceFile: 'src/integrations/openai.ts'
        fields:
          - 'model'
          - 'input'
          - 'instructions'
          - 'tools'
          - 'stream'
          - 'temperature'
          - 'top_p'
          - 'max_output_tokens'
          - 'truncation'
          - 'reasoning'
          - 'think'
        unsupportedFields:
          - 'previous_response_id'
          - 'conversation'
        sdkOnlyFields:
          - 'parallel_tool_calls'
      stream:
        unionName: 'OpenAIResponsesStreamEvent'
        interfaceNames:
          - 'OpenAIResponsesOutputTextDeltaEvent'
          - 'OpenAIResponsesOutputTextDoneEvent'
          - 'OpenAIResponsesFunctionCallArgumentsDeltaEvent'
          - 'OpenAIResponsesFunctionCallArgumentsDoneEvent'
          - 'OpenAIResponsesReasoningTextDeltaEvent'
          - 'OpenAIResponsesReasoningTextDoneEvent'
          - 'OpenAIResponsesReasoningSummaryPartAddedEvent'
          - 'OpenAIResponsesReasoningSummaryPartDoneEvent'
          - 'OpenAIResponsesReasoningSummaryTextDeltaEvent'
          - 'OpenAIResponsesReasoningSummaryTextDoneEvent'
          - 'OpenAIResponsesOutputItemAddedEvent'
          - 'OpenAIResponsesOutputItemDoneEvent'
          - 'OpenAIResponsesContentPartAddedEvent'
          - 'OpenAIResponsesContentPartDoneEvent'
          - 'OpenAIResponsesRefusalDeltaEvent'
          - 'OpenAIResponsesRefusalDoneEvent'
          - 'OpenAIResponsesCreatedEvent'
          - 'OpenAIResponsesInProgressEvent'
          - 'OpenAIResponsesQueuedEvent'
          - 'OpenAIResponsesCompletedEvent'
          - 'OpenAIResponsesFailedEvent'
          - 'OpenAIResponsesIncompleteEvent'
  openaiModels:
    path: /v1/models
    method: GET
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      cloud: supported

  openaiModelsGetOne:
    path: /v1/models/{model}
    method: GET
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      cloud: supported
    notes:
      - 'Returns metadata for a single OpenAI-compat model by id.'

parityBridge:
  openai-chat: openaiChatCompletions
  openai-completions: openaiCompletions
  openai-embeddings: openaiEmbeddings
  openai-responses: openaiResponses
