# System One overlay.
#
# Wave 13: /v1/systemone is now declared in the OpenAPI source
# (contracts/sources/ollama.openapi.yaml) with the full SystemOne*
# schema family. This overlay now provides ONLY behavioral metadata
# that OpenAPI cannot express — the structural schemas (request,
# response, question/answer discriminated unions, usage, content,
# probabilities, confidence) are all sourced from OpenAPI.
#
# Wave 12 originally synthesized this operation from the overlay alone
# (path: + method: + inline schemas) because the pinned OpenAPI
# snapshot didn't contain it. Wave 13 refreshes the OpenAPI source to
# match upstream Ollama, making the workaround obsolete.
#
# Behavioral constraints declared here:
#   - local-only (Ollama Cloud does not support it)
#   - requires Ollama >= 0.35.0
#   - no streaming
#   - no tools, no thinking, no structured output, no logprobs, no embeddings
#   - vision is model-dependent (Clef/Clef Flash support images; text-only
#     models do not)
#   - 64 KiB request limit without images, 32 MiB with images
#   - experimental: behavioral surface may change between Ollama releases

version: 1
service: ollama
domain: native

operations:
  systemOne:
    # Wave 13: reference the OpenAPI path directly. The normalizer
    # inherits method, path, request schema ref, and response schema
    # ref from the OpenAPI operation — no more path:/method: workaround.
    openapi: /v1/systemone
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      cloud: unsupported
    compatibility:
      minVersion: 0.35.0
    limits:
      maxRequestBytes: 65536
      maxRequestBytesWithImages: 33554432
    capabilities:
      tools: unsupported
      vision: model-dependent
      thinking: unsupported
      structuredOutput: unsupported
      logprobs: unsupported
      embeddings: unsupported
    status:
      documented: true
      experimental: true
    notes:
      - 'Local-only; Ollama Cloud rejects /v1/systemone.'
      - '64 KiB request limit without images, 32 MiB with images (includes JSON/base64 overhead).'
      - 'No tools, no generation controls (temperature, top_p, etc.).'
      - 'Vision is model-dependent: images are accepted by vision-weighted models (Clef/Clef Flash) but not by text-only models.'
      - 'Experimental: behavioral surface may change between Ollama releases.'
