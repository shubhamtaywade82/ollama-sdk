# System One overlay.
#
# Wave 13: /v1/systemone is now declared in the OpenAPI source
# (contracts/sources/ollama.openapi.yaml) with the full SystemOne*
# schema family. This overlay now provides ONLY behavioral metadata
# that OpenAPI cannot express — the structural schemas (request,
# response, question/answer discriminated unions, usage, content,
# probabilities, confidence) are all sourced from OpenAPI.
#
# Wave 12 originally synthesized this operation from the overlay alone
# (path: + method: + inline schemas) because the pinned OpenAPI
# snapshot didn't contain it. Wave 13 refreshes the OpenAPI source to
# match upstream Ollama, making the workaround obsolete.
#
# 2026-10-16 refresh (upstream d9b8601, System One cloud launch): /v1/systemone
# now also serves Ollama's cloud (clef:cloud models; https://ollama.com is a
# declared server with optional bearerAuth). The environment guard flipped to
# cloud: supported accordingly, the local byte caps were clarified upstream to
# a DUAL cap (text+schema excluding images <= 64 KiB AND whole request <=
# 32 MiB — both apply simultaneously, replacing the old images-presence
# either/or reading), and 401/402 joined the documented response set.
#
# Behavioral constraints declared here:
#   - local and cloud (cloud models, e.g. clef:cloud, need Ollama >= 0.40.5
#     or the hosted https://ollama.com endpoint)
#   - requires Ollama >= 0.35.0 (>= 0.40.5 for cloud models)
#   - no streaming
#   - no tools, no thinking, no structured output, no logprobs, no embeddings
#   - vision is model-dependent (Clef/Clef Flash support images; text-only
#     models do not)
#   - local dual cap: text+schema (excluding images) <= 64 KiB AND whole
#     request <= 32 MiB; cloud requests <= 13 MiB
#   - experimental: behavioral surface may change between Ollama releases

version: 1
service: ollama
domain: native

operations:
  systemOne:
    # Wave 13: reference the OpenAPI path directly. The normalizer
    # inherits method, path, request schema ref, and response schema
    # ref from the OpenAPI operation — no more path:/method: workaround.
    openapi: /v1/systemone
    runtime:
      streaming: unsupported
      transport: json
    environment:
      local: supported
      # 2026-10-16: upstream launched System One in Ollama's cloud (clef:cloud
      # models). Cloud requests hit the same path — either through the local
      # server (>= 0.40.5, which fronts cloud models and answers 401 with a
      # signin_url when not signed in) or directly against https://ollama.com
      # with bearer auth.
      cloud: supported
    compatibility:
      minVersion: 0.35.0
    limits:
      # Local dual cap (2026-10-16 clarification): BOTH apply to every local
      # request — maxRequestBytes bounds the text+schema portion (images
      # excluded), maxRequestBytesWithImages bounds the whole serialized
      # request (images included). Previously read as an either/or switch on
      # images presence; the runtime now enforces both bounds simultaneously.
      maxRequestBytes: 65536
      maxRequestBytesWithImages: 33554432
    capabilities:
      tools: unsupported
      vision: model-dependent
      thinking: unsupported
      structuredOutput: unsupported
      logprobs: unsupported
      embeddings: unsupported
    status:
      documented: true
      experimental: true
    notes:
      - 'Local and cloud: model accepts cloud models (e.g. clef:cloud); cloud models require Ollama >= 0.40.5 or the hosted https://ollama.com endpoint.'
      - 'Local dual cap: text and schema (excluding images) within 64 KiB AND the whole request within 32 MiB, including base64 and JSON overhead.'
      - "Cloud requests: paid plan or usage credits required; up to 64 questions named with up to 100 ASCII letters, digits, `_`, `.`, or `-`; up to 4 images of at most 4 MiB and 16 megapixels each (8 MiB total); requests within 13 MiB; input within the model's 65,536-token context window."
      - '401 when a cloud model is requested without signing in or with an invalid API key (through a local server the response includes a signin_url); 402 when the cloud model is not included in the Free plan or a payment fails.'
      - 'No tools, no generation controls (temperature, top_p, etc.).'
      - 'Vision is model-dependent: images are accepted by vision-weighted models (Clef/Clef Flash) but not by text-only models.'
      - 'Experimental: behavioral surface may change between Ollama releases.'
